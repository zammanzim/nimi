<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230ea5e9'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E" />
  <title>Masuk Kelas — E-Learniz v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('elearniz_theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      // Perangkat low-end / hemat data: skeleton memakai denyut ringan, bukan sweep.
      try {
        const c = navigator.connection || {};
        if ((navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
            (navigator.deviceMemory && navigator.deviceMemory <= 2) || c.saveData) {
          document.documentElement.classList.add('sk-lite');
        }
      } catch (_) {}
    })();
  </script>
</head>
<body class="login-page-body">

  <div class="login-glass-card">
    <!-- Header with Dynamic Back Button, Step Indicator & Titles -->
    <div class="login-card-header">
      <button type="button" class="login-step-back" id="loginBackBtn" style="display:none;" title="Kembali">
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <!-- Step Dots (Hidden in Staff mode) -->
      <div class="login-step-pills" id="loginStepPills">
        <span class="step-dot active" id="dotStep1"></span>
        <span class="step-dot" id="dotStep2"></span>
        <span class="step-dot" id="dotStep3"></span>
      </div>

      <div class="login-header-icon" id="loginHeaderIcon">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>

      <div id="loginClassBadgeWrap" style="display:none;">
        <span class="login-class-badge-pill" id="loginClassBadge">
          <i class="fa-solid fa-school"></i> <span>XI - RPL 2</span>
        </span>
      </div>

      <h1 id="loginTitle">Pilih Kelas</h1>
      <p id="loginSubtitle">Pilih kelas kamu untuk memulai pembelajaran</p>
    </div>

    <div class="login-card-body">
      <!-- Error / Notice Alert -->
      <div class="login-alert" id="loginAlert" style="display:none;"></div>

      <!-- ================= STEP 1: PILIH KELAS ================= -->
      <div class="step-pane active" id="paneStep1">
        <div class="login-class-list" id="classListContainer">
          <div class="sk-login-list" role="status" aria-label="Memuat daftar kelas...">
            <span class="sk sk-rounded" style="height:52px;"></span>
            <span class="sk sk-rounded" style="height:52px;"></span>
            <span class="sk sk-rounded" style="height:52px;"></span>
          </div>
        </div>

        <div class="login-divider">
          <span>atau</span>
        </div>

        <button type="button" class="btn-guest-block" id="btnGuestMode">
          <i class="fa-solid fa-user-secret"></i> Masuk sebagai Tamu (Mode Lihat)
        </button>

        <div class="staff-login-link-wrap">
          <button type="button" class="btn-staff-link" id="btnGoStaff">
            <i class="fa-solid fa-user-shield"></i> Khusus Staf / Pengajar
          </button>
        </div>
      </div>

      <!-- ================= STEP 2: PILIH NAMA ================= -->
      <div class="step-pane" id="paneStep2">
        <div class="login-search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="studentSearchInput" placeholder="Ketik untuk mencari namamu..." autocomplete="off" />
          <button type="button" id="clearSearchBtn" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="student-list-scroll" id="studentListContainer">
          <div class="sk-login-list" role="status" aria-label="Memuat daftar siswa...">
            <span class="sk sk-rounded" style="height:46px;"></span>
            <span class="sk sk-rounded" style="height:46px;"></span>
            <span class="sk sk-rounded" style="height:46px;"></span>
            <span class="sk sk-rounded" style="height:46px;"></span>
            <span class="sk sk-rounded" style="height:46px;"></span>
          </div>
        </div>
      </div>

      <!-- ================= STEP 3: KONFIRMASI ================= -->
      <div class="step-pane" id="paneStep3">
        <!-- Skeleton singkat saat transisi setelah memilih nama -->
        <div class="confirm-skeleton" id="confirmSkeleton" style="display:none;" role="status" aria-label="Memuat konfirmasi...">
          <span class="sk sk-circle" style="width:72px;height:72px;"></span>
          <span class="sk sk-pill" style="width:110px;height:22px;"></span>
          <span class="sk" style="width:60%;height:24px;"></span>
          <span class="sk" style="width:80%;height:13px;"></span>
          <span class="sk sk-rounded" style="width:100%;height:48px;margin-top:0.6rem;"></span>
          <span class="sk sk-rounded" style="width:100%;height:42px;"></span>
        </div>
        <div id="confirmContent">
        <div class="confirm-profile-box">
          <div class="confirm-avatar" id="confirmAvatar">S</div>
          <span class="confirm-class-pill" id="confirmClassPill">
            <i class="fa-solid fa-school"></i> <span id="confirmClassName">-</span>
          </span>
          <h2 class="confirm-greeting" id="confirmGreeting">Halo, Siswa!</h2>
          <p class="confirm-question">Ini beneran kamu? Ayo masuk ke kelas sekarang!</p>
        </div>

        <button type="button" class="btn-primary btn-block btn-confirm-enter" id="btnConfirmEnter">
          <i class="fa-solid fa-rocket"></i> Ayo Masuk!
        </button>

        <button type="button" class="btn-secondary btn-block" id="btnChangeStudent" style="margin-top:0.65rem;">
          Bukan saya, ganti nama
        </button>
        </div>
      </div>

      <!-- ================= KHUSUS STAF / VERIFIKASI AKUN ================= -->
      <div class="step-pane" id="paneStaff">
        <div id="staffUserBadgeWrap" style="text-align:center;margin-bottom:0.85rem;display:none;">
          <span class="confirm-class-pill" id="staffUserBadge">
            <i class="fa-solid fa-shield-halved"></i> <span id="staffUserBadgeText">Akun Dilindungi Password</span>
          </span>
        </div>

        <form id="staffLoginForm" class="form-stack">
          <div class="form-group">
            <label for="staffUsername"><i class="fa-solid fa-user-tie"></i> Email / Nama Akun Staf</label>
            <input type="text" id="staffUsername" placeholder="Contoh: nama@e-learniz.my.id atau nizam" autocomplete="username" required />
          </div>

          <div class="form-group">
            <label for="staffPassword"><i class="fa-solid fa-lock"></i> Password Akun</label>
            <input type="password" id="staffPassword" placeholder="Masukkan password kamu" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn-primary btn-block" id="staffSubmitBtn" style="margin-top:0.4rem;">
            <i class="fa-solid fa-key"></i> Masuk Sekarang
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/time.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 0. AUTO REDIRECT jika sesi yang tersimpan masih valid.
      //    Sesi staf diverifikasi ulang ke Supabase Auth + role v3.users,
      //    jadi localStorage yang dioprek tidak otomatis masuk mode admin.
      const existingUser = window.ELearnizAuth.getCurrentUser();
      if (existingUser) {
        let verified = existingUser;
        try {
          verified = await window.ELearnizAuth.verifyStaffSession();
        } catch (_) {
          verified = null;
        }
        if (verified) {
          window.location.replace('index.html');
          return;
        }
      }

      const esc = (window.ELearnizUI && window.ELearnizUI.escapeHtml)
        ? window.ELearnizUI.escapeHtml
        : (str) => String(str === null || str === undefined ? '' : str);

      // State
      let currentStep = 1; // 1 | 2 | 3 | 'staff'
      let staffOriginStep = 1; // 1 (dari link bawah) atau 2 (dari klik nama ber-auth)
      let classes = [];
      let selectedClass = null;
      let students = [];
      let selectedStudent = null;

      // Elements
      const backBtn = document.getElementById('loginBackBtn');
      const stepPills = document.getElementById('loginStepPills');
      const headerIcon = document.getElementById('loginHeaderIcon');
      const classBadgeWrap = document.getElementById('loginClassBadgeWrap');
      const classBadge = document.getElementById('loginClassBadge');
      const titleEl = document.getElementById('loginTitle');
      const subtitleEl = document.getElementById('loginSubtitle');
      const alertBox = document.getElementById('loginAlert');

      const paneStep1 = document.getElementById('paneStep1');
      const paneStep2 = document.getElementById('paneStep2');
      const paneStep3 = document.getElementById('paneStep3');
      const paneStaff = document.getElementById('paneStaff');

      const classListContainer = document.getElementById('classListContainer');
      const btnGuestMode = document.getElementById('btnGuestMode');
      const btnGoStaff = document.getElementById('btnGoStaff');

      const studentSearchInput = document.getElementById('studentSearchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const studentListContainer = document.getElementById('studentListContainer');

      const confirmAvatar = document.getElementById('confirmAvatar');
      const confirmClassName = document.getElementById('confirmClassName');
      const confirmGreeting = document.getElementById('confirmGreeting');
      const btnConfirmEnter = document.getElementById('btnConfirmEnter');
      const btnChangeStudent = document.getElementById('btnChangeStudent');

      const staffForm = document.getElementById('staffLoginForm');
      const staffSubmitBtn = document.getElementById('staffSubmitBtn');
      const staffUserBadgeWrap = document.getElementById('staffUserBadgeWrap');
      const staffUserBadgeText = document.getElementById('staffUserBadgeText');

      function showAlert(msg) {
        alertBox.textContent = msg;
        alertBox.style.display = 'block';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      // Helper untuk mendeteksi akun ber-password (staf/guru/super_admin/auth)
      function isUserPrivileged(user) {
        if (!user) return false;
        const role = String(user.role || '').toLowerCase();
        const staffRoles = ['admin', 'super_admin', 'superadmin', 'class_admin', 'teacher', 'guru', 'staff'];
        if (staffRoles.includes(role)) return true;
        return Boolean(user.auth_user_id);
      }

      // Transition manager between steps
      let confirmSkeletonToken = 0;

      function goToStep(step, origin) {
        hideAlert();
        currentStep = step;
        if (step !== 3) confirmSkeletonToken++;

        // Hide all panes
        [paneStep1, paneStep2, paneStep3, paneStaff].forEach((p) => p.classList.remove('active'));

        // Update step dots
        document.getElementById('dotStep1').className = 'step-dot' + (step === 1 ? ' active' : '');
        document.getElementById('dotStep2').className = 'step-dot' + (step === 2 ? ' active' : '');
        document.getElementById('dotStep3').className = 'step-dot' + (step === 3 ? ' active' : '');

        if (step === 1) {
          paneStep1.classList.add('active');
          backBtn.style.display = 'none';
          stepPills.style.display = 'flex';
          headerIcon.style.display = 'inline-flex';
          headerIcon.innerHTML = '<i class="fa-solid fa-graduation-cap"></i>';
          classBadgeWrap.style.display = 'none';
          titleEl.textContent = 'Pilih Kelas';
          subtitleEl.textContent = 'Pilih kelas kamu untuk memulai pembelajaran';
        } else if (step === 2) {
          paneStep2.classList.add('active');
          backBtn.style.display = 'flex';
          stepPills.style.display = 'flex';
          headerIcon.style.display = 'none';
          classBadgeWrap.style.display = 'block';
          classBadge.querySelector('span').textContent = selectedClass ? selectedClass.name : 'Kelas';
          titleEl.textContent = 'Pilih Nama Kamu';
          subtitleEl.textContent = 'Cari dan pilih nama kamu dari daftar siswa';
          studentSearchInput.value = '';
          clearSearchBtn.style.display = 'none';
          renderStudentList(students);
          setTimeout(() => studentSearchInput.focus(), 100);
        } else if (step === 3) {
          paneStep3.classList.add('active');
          backBtn.style.display = 'flex';
          stepPills.style.display = 'flex';
          headerIcon.style.display = 'none';
          classBadgeWrap.style.display = 'none';
          titleEl.textContent = 'Konfirmasi Masuk';
          subtitleEl.textContent = 'Pastikan data diri kamu sudah sesuai';

          if (selectedStudent) {
            const fullName = String(selectedStudent.full_name || selectedStudent.nickname || 'Siswa');
            const nick = selectedStudent.nickname || fullName.split(' ')[0] || 'Siswa';
            confirmAvatar.textContent = (String(nick).charAt(0) || 'S').toUpperCase();
            confirmClassName.textContent = selectedClass ? selectedClass.name : 'Kelas';
            confirmGreeting.textContent = `Halo, ${nick}!`;
          }

          // Tampilkan skeleton sebentar setelah memilih nama, lalu munculkan konfirmasi.
          const skEl = document.getElementById('confirmSkeleton');
          const contentEl = document.getElementById('confirmContent');
          if (skEl && contentEl) {
            const token = ++confirmSkeletonToken;
            skEl.style.display = 'flex';
            contentEl.style.display = 'none';
            setTimeout(() => {
              if (token !== confirmSkeletonToken) return;
              skEl.style.display = 'none';
              contentEl.style.display = '';
            }, 450);
          }
        } else if (step === 'staff') {
          staffOriginStep = origin || 1;
          paneStaff.classList.add('active');
          backBtn.style.display = 'flex';
          stepPills.style.display = 'none';
          headerIcon.style.display = 'inline-flex';
          headerIcon.innerHTML = '<i class="fa-solid fa-user-shield"></i>';
          classBadgeWrap.style.display = 'none';

          if (staffOriginStep === 2 && selectedStudent) {
            const role = String(selectedStudent.role || '').toLowerCase();
            const roleLabel = role === 'super_admin' || role === 'superadmin' ? 'Super Admin' : (role === 'teacher' || role === 'guru' ? 'Guru' : 'Staf / Admin');
            titleEl.textContent = `Verifikasi Password`;
            subtitleEl.textContent = `Akun ${selectedStudent.nickname || selectedStudent.full_name || 'staf'} dilindungi kata sandi`;

            const nicknameKey = String(selectedStudent.nickname || '').toLowerCase();
            const aliases = typeof V3_STAFF_EMAIL_ALIASES !== 'undefined' ? V3_STAFF_EMAIL_ALIASES : {};
            document.getElementById('staffUsername').value = aliases[nicknameKey] || '';

            if (staffUserBadgeWrap && staffUserBadgeText) {
              staffUserBadgeText.textContent = `${selectedStudent.full_name || selectedStudent.nickname || 'Staf'} (${roleLabel})`;
              staffUserBadgeWrap.style.display = 'block';
            }
          } else {
            titleEl.textContent = 'Khusus Staf / Pengajar';
            subtitleEl.textContent = 'Masuk dengan akun staf atau admin kelas';
            document.getElementById('staffUsername').value = '';
            if (staffUserBadgeWrap) staffUserBadgeWrap.style.display = 'none';
          }

          document.getElementById('staffPassword').value = '';
          setTimeout(() => document.getElementById('staffPassword').focus(), 150);
        }
      }

      // Back navigation
      backBtn.addEventListener('click', () => {
        if (currentStep === 2) {
          goToStep(1);
        } else if (currentStep === 3) {
          goToStep(2);
        } else if (currentStep === 'staff') {
          goToStep(staffOriginStep || 1);
        }
      });

      // 1. LOAD CLASSES
      try {
        classes = await window.ELearnizDB.listClasses();
        if (!classes || classes.length === 0) {
          classListContainer.innerHTML = `
            <div style="text-align:center;padding:1.5rem 0;color:var(--text-muted);font-weight:600;">
              <i class="fa-solid fa-school-circle-xmark"></i><br>Belum ada kelas aktif.
            </div>
          `;
        } else {
          classListContainer.innerHTML = classes.map((c) => `
            <button type="button" class="login-class-card" data-class-id="${esc(c.id)}" data-class-slug="${esc(c.slug)}">
              <div class="lcc-icon">
                <i class="fa-solid fa-school"></i>
              </div>
              <div class="lcc-text">
                <strong>${esc(c.name)}</strong>
                <span>Tahun Ajaran ${esc(c.school_year || 'Aktif')}</span>
              </div>
              <i class="fa-solid fa-chevron-right lcc-arrow"></i>
            </button>
          `).join('');

          // Attach click to class cards
          classListContainer.querySelectorAll('.login-class-card').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const cid = Number(btn.dataset.classId);
              const found = classes.find((c) => Number(c.id) === cid) || classes[0];
              selectedClass = found;
              window.ELearnizAuth.setActiveClassSlug(found.slug);

              // Load students for this class. Flag loading dipasang SEBELUM goToStep(2)
              // karena goToStep memanggil renderStudentList (kalau tidak, muncul "Nama tidak ditemukan").
              studentsLoading = true;
              students = [];
              goToStep(2);

              try {
                students = await window.ELearnizDB.listUsers(found.id);
              } catch (err) {
                students = [];
                studentsLoading = false;
                showAlert('Gagal mengambil daftar siswa. Coba lagi.');
                renderStudentList([]);
                return;
              }
              studentsLoading = false;
              renderStudentList(students);
            });
          });
        }
      } catch (err) {
        classListContainer.innerHTML = `
          <div style="text-align:center;padding:1.5rem 0;color:var(--coral-rose);font-weight:700;">
            Gagal memuat kelas. Periksa koneksi lalu segarkan halaman.
          </div>
        `;
      }

      // Render Student List in Step 2
      let studentsLoading = false;

      function renderStudentList(list) {
        if (studentsLoading) {
          studentListContainer.innerHTML = `
            <div class="sk-login-list" role="status" aria-label="Mengambil daftar siswa...">
              <span class="sk sk-rounded" style="height:46px;"></span>
              <span class="sk sk-rounded" style="height:46px;"></span>
              <span class="sk sk-rounded" style="height:46px;"></span>
              <span class="sk sk-rounded" style="height:46px;"></span>
              <span class="sk sk-rounded" style="height:46px;"></span>
            </div>
          `;
          return;
        }
        if (!list || list.length === 0) {
          studentListContainer.innerHTML = `
            <div class="student-empty-state">
              <i class="fa-solid fa-user-xmark" style="font-size:1.8rem;margin-bottom:0.5rem;display:block;opacity:0.5;"></i>
              Nama tidak ditemukan.<br>Periksa ejaan pencarian kamu.
            </div>
          `;
          return;
        }

        studentListContainer.innerHTML = list.map((s) => {
          const displayName = s.full_name || s.nickname || 'Siswa';
          const initial = String(s.nickname || displayName).charAt(0).toUpperCase() || 'S';
          const isPrivileged = isUserPrivileged(s);
          const role = String(s.role || '').toLowerCase();
          const roleLabel = role === 'super_admin' || role === 'superadmin' ? 'Super Admin' : (role === 'teacher' || role === 'guru' ? 'Guru' : 'Admin');

          return `
            <button type="button" class="student-select-item ${isPrivileged ? 'is-privileged' : ''}" data-student-id="${esc(s.id)}">
              <div class="ssi-avatar">${esc(initial)}</div>
              <div class="ssi-meta">
                <div style="display:flex;align-items:center;gap:0.45rem;">
                  <strong>${esc(displayName)}</strong>
                  ${isPrivileged ? `<span class="ssi-lock-badge" title="Akun dilindungi kata sandi"><i class="fa-solid fa-lock"></i> ${esc(roleLabel)}</span>` : ''}
                </div>
                <span>${isPrivileged ? 'Akun ber-password' : `Panggilan: ${esc(s.nickname || '-')}`}</span>
              </div>
              <i class="fa-solid fa-chevron-right ssi-arrow"></i>
            </button>
          `;
        }).join('');

        studentListContainer.querySelectorAll('.student-select-item').forEach((btn) => {
          btn.addEventListener('click', () => {
            const sid = Number(btn.dataset.studentId);
            selectedStudent = students.find((s) => Number(s.id) === sid);
            if (!selectedStudent) return;

            // Jika akun staf / admin / ber-auth -> minta password
            if (isUserPrivileged(selectedStudent)) {
              goToStep('staff', 2);
            } else {
              // Jika siswa biasa -> konfirmasi nama
              goToStep(3);
            }
          });
        });
      }

      // Filter Students in Step 2
      studentSearchInput.addEventListener('input', () => {
        const query = studentSearchInput.value.trim().toLowerCase();
        clearSearchBtn.style.display = query ? 'block' : 'none';
        if (!query) {
          renderStudentList(students);
          return;
        }
        const filtered = students.filter((s) => {
          const fn = (s.full_name || '').toLowerCase();
          const nn = (s.nickname || '').toLowerCase();
          return fn.includes(query) || nn.includes(query);
        });
        renderStudentList(filtered);
      });

      clearSearchBtn.addEventListener('click', () => {
        studentSearchInput.value = '';
        clearSearchBtn.style.display = 'none';
        studentSearchInput.focus();
        renderStudentList(students);
      });

      // Step 3 Actions (Siswa Biasa)
      btnChangeStudent.addEventListener('click', () => {
        goToStep(2);
      });

      btnConfirmEnter.addEventListener('click', () => {
        if (!selectedStudent || !selectedClass) {
          goToStep(1);
          return;
        }

        btnConfirmEnter.disabled = true;
        btnConfirmEnter.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Masuk ke kelas...';

        try {
          window.ELearnizAuth.loginStudent(selectedStudent, selectedClass.slug);
          window.location.replace('index.html');
        } catch (err) {
          showAlert('Gagal masuk ke kelas. Coba ulangi.');
          btnConfirmEnter.disabled = false;
          btnConfirmEnter.innerHTML = '<i class="fa-solid fa-rocket"></i> Ayo Masuk!';
        }
      });

      // Mode Tamu Action
      btnGuestMode.addEventListener('click', () => {
        const fallbackSlug = (selectedClass && selectedClass.slug) || (classes[0] && classes[0].slug);
        if (!fallbackSlug) {
          showAlert('Belum ada kelas aktif yang bisa dibuka.');
          return;
        }
        window.ELearnizAuth.enterAsGuest(fallbackSlug);
        window.location.replace('index.html');
      });

      // Staff Mode Trigger (dari link Step 1)
      btnGoStaff.addEventListener('click', () => {
        selectedStudent = null;
        goToStep('staff', 1);
      });

      // Staff Login Form Submit
      staffForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();
        const username = document.getElementById('staffUsername').value.trim();
        const pass = document.getElementById('staffPassword').value.trim();
        const fallbackSlug = (selectedClass && selectedClass.slug) || (classes[0] && classes[0].slug) || null;

        if (!fallbackSlug) {
          showAlert('Belum ada kelas aktif. Hubungi admin sekolah.');
          return;
        }

        staffSubmitBtn.disabled = true;
        staffSubmitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...';

        try {
          const session = await window.ELearnizAuth.login(fallbackSlug, username, pass);

          // Ikuti kelas asal akun staf, bukan asal pilihan di layar login.
          if (session && session.class_id) {
            const staffClass = classes.find((c) => Number(c.id) === Number(session.class_id));
            if (staffClass) window.ELearnizAuth.setActiveClassSlug(staffClass.slug);
          }

          window.location.replace('index.html');
        } catch (err) {
          showAlert(err.message || 'Login gagal. Periksa email dan password kamu.');
          staffSubmitBtn.disabled = false;
          staffSubmitBtn.innerHTML = '<i class="fa-solid fa-key"></i> Masuk Sekarang';
        }
      });
    });
  </script>
</body>
