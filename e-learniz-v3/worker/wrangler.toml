# wrangler.toml — Worker elearniz-media-presign (e-learniz v3)
# Deploy: cd worker && npx wrangler deploy
#
# Secret (JANGAN taruh di file ini) — set dulu sebelum deploy:
#   npx wrangler secret put R2_ACCESS_KEY        # dari R2 API token
#   npx wrangler secret put R2_SECRET_KEY
#   npx wrangler secret put SUPABASE_SERVICE_KEY # service_role, buat cek role staff
#
# Langkah awal di dashboard Cloudflare:
#   1. R2 → Create bucket "e-learniz-v3" (pake nama yg udah ada di akun ini)
#   2. Settings → Custom Domains → tambah https://media.e-learniz.my.id
#   3. Settings → CORS policy:
#        AllowOrigin  = https://e-learniz.my.id
#        AllowMethods = PUT, DELETE, GET, HEAD
#        AllowHeaders = Content-Type
#   4. R2 → Manage R2 API Tokens → Object Read & Write → jadiin secret

name = "elearniz-media-presign"
main = "elearniz-media-presign.js"
compatibility_date = "2024-09-01"

[vars]
# Endpoint S3-compatible R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
# (account yang sama kyk osistarpone)
R2_ENDPOINT = "https://3867256d31431bf04133a573895a27da.r2.cloudflarestorage.com"
# Nama bucket — HARUS sama dgn yang ada di dashboard R2 (bukan "elearniz-media",
# itu nama rencana awal; bucket aslinya dibuat bernama e-learniz-v3).
R2_BUCKET = "e-learniz-v3"
R2_REGION = "auto"
# Domain publik R2 (custom domain) — harus sama dgn V3_R2_PUBLIC_BASE di js/config.js
PUBLIC_BASE_URL = "https://media-v3.e-learniz.my.id"
SUPABASE_URL = "https://vttmwtlqzbbiaromohrp.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dG13dGxxemJiaWFyb21vaHJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyNjg4NTMsImV4cCI6MjA4MDg0NDg1M30.16SwOEqD5ZNAgk1oWhLrL41Eqw4kkeAKTyHxkSqmpiY"
# Domain frontend yang boleh manggil (pisahkan koma bila banyak)
ALLOWED_ORIGIN = "https://e-learniz.my.id"
