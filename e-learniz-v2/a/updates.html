<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Updates • E-Learning Nizam</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-clients.js?v=20260822" defer></script>
    <script src="../js/ctx-menu.js?v=20260822"></script>
    <script src="../js/ui-components.js?v=20260822" defer></script>

<script src="../js/lang.js?v=20260822"></script>
<script src="../js/basicfeat.js?v=20260822"></script>
<script src="../js/show-popup.js?v=20260822"></script>
    <script src="../js/auth.js?v=20260822" defer></script>
    <script src="../js/activity.js?v=20260822" defer></script>
    <script src="../js/visitor.js?v=20260822" defer></script>
    <script src="../js/subject-manager.js?v=20260822" defer></script>

    <link rel="stylesheet" href="../css/styleasli.css?v=20260822">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="icons/announcements.png" type="image/png">
    <style>
        /* ── TIMELINE WRAPPER ── */
        .updates-timeline {
            position: relative;
            padding: 8px 0 40px 0;
        }

        .updates-timeline::before {
            content: '';
            position: absolute;
            left: 18px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom,
                    rgba(0, 234, 255, 0.6) 0%,
                    rgba(0, 234, 255, 0.15) 70%,
                    transparent 100%);
        }

        /* ── SINGLE UPDATE CARD ── */
        .update-entry {
            position: relative;
            margin-bottom: 28px;
            padding-left: 50px;
            animation: fadeInUp 0.4s ease both;
        }

        .update-entry:nth-child(1) {
            animation-delay: 0.05s;
        }

        .update-entry:nth-child(2) {
            animation-delay: 0.1s;
        }

        .update-entry:nth-child(3) {
            animation-delay: 0.15s;
        }

        .update-entry:nth-child(4) {
            animation-delay: 0.2s;
        }

        .update-entry:nth-child(5) {
            animation-delay: 0.25s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Dot di timeline */
        .update-dot {
            position: absolute;
            left: 10px;
            top: 16px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #0a0a0c;
            border: 2px solid var(--accent, #00eaff);
            box-shadow: 0 0 10px rgba(0, 234, 255, 0.5);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .update-dot i {
            font-size: 7px;
            color: var(--accent, #00eaff);
        }

        /* Kartu update */
        .update-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 16px 18px;
            transition: border-color 0.25s;
        }

        .update-card:hover {
            border-color: rgba(0, 234, 255, 0.2);
        }

        /* Header kartu */
        .update-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .update-card-title {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            margin: 0;
            line-height: 1.3;
            flex: 1;
        }

        .update-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .update-version {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent, #00eaff);
            background: rgba(0, 234, 255, 0.1);
            border: 1px solid rgba(0, 234, 255, 0.25);
            border-radius: 20px;
            padding: 2px 10px;
        }

        .update-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
        }

        /* Admin actions */
        .update-admin-actions {
            display: none;
            gap: 6px;
            margin-left: auto;
        }

        .is-admin .update-admin-actions {
            display: flex;
        }

        .update-action-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            padding: 4px 6px;
            font-size: 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .update-action-btn:hover {
            color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
        }

        /* Items list */
        .update-items {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .update-item {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.5;
        }

        .update-item-badge {
            flex-shrink: 0;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.8px;
            padding: 2px 7px;
            border-radius: 20px;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .badge-new {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .badge-fix {
            background: rgba(255, 71, 87, 0.12);
            color: #ff6b7a;
            border: 1px solid rgba(255, 71, 87, 0.25);
        }

        .badge-improve {
            background: rgba(255, 159, 67, 0.12);
            color: #ff9f43;
            border: 1px solid rgba(255, 159, 67, 0.25);
        }

        .badge-remove {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ── EMPTY STATE ── */
        .updates-empty {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.25);
        }

        .updates-empty i {
            font-size: 36px;
            margin-bottom: 12px;
            display: block;
            opacity: 0.4;
        }

        /* ── SKELETON ── */
        .update-skeleton {
            padding-left: 50px;
            margin-bottom: 28px;
        }

        .update-skeleton .sk-dot {
            position: absolute;
            left: 10px;
            top: 16px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
        }

        /* ── MODAL ── */
        #updatesModal .glass-modal-box {
            max-width: 500px;
            width: 94vw;
            max-height: 90vh;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-row select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            width: 100px;
        }

        .item-row select option {
            background: #111;
        }

        .item-row input {
            flex: 1;
        }

        .item-row .remove-item-btn {
            background: transparent;
            border: none;
            color: rgba(255, 71, 87, 0.5);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            flex-shrink: 0;
            transition: color 0.2s;
        }

        .item-row .remove-item-btn:hover {
            color: #ff4757;
        }

        .add-item-btn {
            width: 100%;
            padding: 10px;
            background: rgba(0, 234, 255, 0.05);
            border: 1px dashed rgba(0, 234, 255, 0.25);
            border-radius: 10px;
            color: rgba(0, 234, 255, 0.6);
            cursor: pointer;
            font-size: 13px;
            margin-top: 4px;
            transition: all 0.2s;
        }

        .add-item-btn:hover {
            background: rgba(0, 234, 255, 0.1);
            color: #00eaff;
        }

        /* ── FAB ── */
        .updates-fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 999;
            display: none;
        }

        .updates-fab button {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00eaff, #007bff);
            border: none;
            color: #000;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(0, 234, 255, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .updates-fab button:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(0, 234, 255, 0.5);
        }

        /* ── FILTER PILLS ── */
        .filter-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 6px 13px;
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .filter-pill:hover {
            background: rgba(255, 255, 255, 0.09);
            color: rgba(255, 255, 255, 0.7);
        }

        .filter-pill.active {
            background: rgba(0, 234, 255, 0.1);
            border-color: rgba(0, 234, 255, 0.35);
            color: var(--accent, #00eaff);
        }

        .filter-pill[data-filter="new"].active {
            background: rgba(46, 213, 115, 0.1);
            border-color: rgba(46, 213, 115, 0.35);
            color: #2ed573;
        }

        .filter-pill[data-filter="fix"].active {
            background: rgba(255, 71, 87, 0.1);
            border-color: rgba(255, 71, 87, 0.35);
            color: #ff6b7a;
        }

        .filter-pill[data-filter="improve"].active {
            background: rgba(255, 159, 67, 0.1);
            border-color: rgba(255, 159, 67, 0.35);
            color: #ff9f43;
        }

        .filter-pill[data-filter="remove"].active {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
        }

        /* Filtered out entries */
        .update-entry.filtered-out {
            display: none;
        }

        /* Stat breakdown badges */
        .stat-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="sidebar" id="sidebar"></div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="main-content">
        <div class="left-section">
            <div class="glow">
                <h1 data-i18n="updates"><i class="fa-solid fa-rocket" style="font-size:22px;"></i></h1>
                <p style="color:rgba(255,255,255,0.35); font-size:12px; margin-top:4px;" data-i18n="update_desc">
                </p>
            </div>

            <!-- Stats Card -->
            <div id="updatesStatsCard" style="
                background: rgba(0,0,0,0.3);
                border: 1px solid rgba(255,255,255,0.07);
                border-radius: 16px;
                padding: 16px;
                margin-top: 16px;
                display: none;
            ">
                <div
                    style="font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; color:rgba(0,234,255,0.5); margin-bottom:14px;">
                    <i class="fa-solid fa-chart-simple" style="margin-right:6px;"></i>Ringkasan
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div
                        style="background:rgba(0,234,255,0.05); border:1px solid rgba(0,234,255,0.1); border-radius:12px; padding:12px; text-align:center;">
                        <div id="statTotal" style="font-size:24px; font-weight:800; color:#fff; line-height:1;">—</div>
                        <div style="font-size:10px; color:rgba(255,255,255,0.35); margin-top:4px; font-weight:600;" data-i18n="total_update"></div>
                    </div>
                    <div
                        style="background:rgba(0,234,255,0.05); border:1px solid rgba(0,234,255,0.1); border-radius:12px; padding:12px; text-align:center;">
                        <div id="statVersion"
                            style="font-size:15px; font-weight:800; color:var(--accent,#00eaff); line-height:1;">—</div>
                        <div style="font-size:10px; color:rgba(255,255,255,0.35); margin-top:4px; font-weight:600;">
                            Versi Terbaru</div>
                    </div>
                </div>
                <!-- Type breakdown -->
                <div id="statBreakdown" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;"></div>
                <!-- Last updated -->
                <div id="statLastDate"
                    style="font-size:11px; color:rgba(255,255,255,0.25); margin-top:12px; text-align:center;"></div>
            </div>

            <!-- Filter Pills -->
            <div id="filterWrap" style="margin-top:14px; display:none;">
                <div
                    style="font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; color:rgba(0,234,255,0.5); margin-bottom:10px;">
                    <i class="fa-solid fa-filter" style="margin-right:6px;"></i>Filter
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                    <button class="filter-pill active" data-filter="all" onclick="applyFilter('all', this)" data-i18n="all">
                        <i class="fa-solid fa-border-all"></i>
                    </button>
                    <button class="filter-pill" data-filter="new" onclick="applyFilter('new', this)"
                        style="--pill-color: rgba(46,213,115,0.7);">
                        <i class="fa-solid fa-star"></i> NEW
                    </button>
                    <button class="filter-pill" data-filter="fix" onclick="applyFilter('fix', this)"
                        style="--pill-color: rgba(255,107,118,0.7);">
                        <i class="fa-solid fa-bug"></i> FIX
                    </button>
                    <button class="filter-pill" data-filter="improve" onclick="applyFilter('improve', this)"
                        style="--pill-color: rgba(255,159,67,0.7);">
                        <i class="fa-solid fa-bolt"></i> IMPROVE
                    </button>
                    <button class="filter-pill" data-filter="remove" onclick="applyFilter('remove', this)"
                        style="--pill-color: rgba(255,255,255,0.35);">
                        <i class="fa-solid fa-trash"></i> REMOVE
                    </button>
                </div>
            </div>
        </div>

        <div class="right-section">
            <div id="updatesContainer">
                <!-- skeleton -->
                <div style="position:relative; padding-left:50px; margin-bottom:28px;">
                    <div class="skeleton"
                        style="position:absolute;left:10px;top:16px;width:18px;height:18px;border-radius:50%;"></div>
                    <div class="course-card" style="padding:16px 18px;">
                        <div class="skeleton sk-title" style="width:55%; margin-bottom:12px;"></div>
                        <div class="skeleton sk-text"></div>
                        <div class="skeleton sk-text short"></div>
                    </div>
                </div>
                <div style="position:relative; padding-left:50px; margin-bottom:28px;">
                    <div class="skeleton"
                        style="position:absolute;left:10px;top:16px;width:18px;height:18px;border-radius:50%;"></div>
                    <div class="course-card" style="padding:16px 18px;">
                        <div class="skeleton sk-title" style="width:40%; margin-bottom:12px;"></div>
                        <div class="skeleton sk-text"></div>
                        <div class="skeleton sk-text"></div>
                        <div class="skeleton sk-text short"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FAB (admin only) -->
    <div class="updates-fab" id="updatesFab">
        <button onclick="openUpdatesModal()" title="Tambah Update">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- Modal tambah update -->
    <div id="updatesModal" class="modal-overlay hidden" style="z-index:3000;">
        <div class="glass-modal-box">
            <h3 style="margin-bottom:18px;" data-i18n="new_update"><i class="fa-solid fa-rocket"></i></h3>

            <input type="text" id="um_title" class="glass-input" data-i18n-placeholder="update_title_placeholder"
                spellcheck="false">
            <input type="text" id="um_version" class="glass-input" placeholder="Versi  (opsional, cth: v2.3)"
                spellcheck="false" style="font-size:12px;">

            <label style="font-size:12px; color:#aaa; margin:12px 0 8px; display:block;">
                <i class="fa-solid fa-list-ul" style="margin-right:6px;"></i>Daftar Perubahan
            </label>
            <div id="um_itemsWrap"></div>
            <button class="add-item-btn" onclick="addItemRow()">
                <i class="fa-solid fa-plus"></i> Tambah baris
            </button>

            <div class="action-buttons" style="margin-top:20px;">
                <button class="btn-glass-cancel" onclick="closeUpdatesModal()" data-i18n="cancel"></button>
                <button class="btn-glass-save" id="um_btnSave" onclick="saveUpdate()" data-i18n="save">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const TYPE_LABELS = { new: 'NEW', fix: 'FIX', improve: 'IMPROVE', remove: 'REMOVE' };
        const TYPE_CLASS = { new: 'badge-new', fix: 'badge-fix', improve: 'badge-improve', remove: 'badge-remove' };

        let _isAdmin = false;

        // ── INIT ──────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async () => {
            const user = (() => { try { return JSON.parse(localStorage.getItem('user')); } catch (e) { return null; } })();
            if (!user) return;

            _isAdmin = user.role === 'class_admin' || user.role === 'super_admin';
            if (_isAdmin) document.getElementById('updatesFab').style.display = 'block';
            if (_isAdmin) document.body.classList.add('is-admin');

            await loadUpdates();
        });

        // ── LOAD ──────────────────────────────────────────────────────
        async function loadUpdates() {
            const container = document.getElementById('updatesContainer');
            try {
                const { data, error } = await supabase
                    .from('app_updates')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="updates-empty">
                            <i class="fa-solid fa-rocket"></i>
                            <p>${t('no_update_recorded')}</p>
                        </div>`;
                    return;
                }

                renderUpdates(data);
            } catch (err) {
                console.error('Load updates gagal:', err);
                container.innerHTML = `<p style="color:#ff4757; padding:20px; text-align:center;">${t('failed_generic')} memuat data.</p>`;
            }
        }

        // ── RENDER ────────────────────────────────────────────────────
        function renderUpdates(data) {
            const container = document.getElementById('updatesContainer');
            const timeline = document.createElement('div');
            timeline.className = 'updates-timeline';

            data.forEach(entry => {
                const items = Array.isArray(entry.items) ? entry.items : [];
                const date = new Date(entry.created_at).toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });

                const itemsHTML = items.map(it => `
                    <li class="update-item">
                        <span class="update-item-badge ${TYPE_CLASS[it.type] || 'badge-new'}">
                            ${TYPE_LABELS[it.type] || 'NEW'}
                        </span>
                        <span>${it.text}</span>
                    </li>`).join('');

                const el = document.createElement('div');
                el.className = 'update-entry';
                el.dataset.id = entry.id;
                el.innerHTML = `
                    <div class="update-dot"><i class="fa-solid fa-circle"></i></div>
                    <div class="update-card">
                        <div class="update-card-header">
                            <p class="update-card-title">${entry.title}</p>
                            <div class="update-meta">
                                ${entry.version ? `<span class="update-version">${entry.version}</span>` : ''}
                                <span class="update-date">${date}</span>
                            </div>
                            <div class="update-admin-actions">
                                <button class="update-action-btn" onclick="deleteUpdate(event, '${entry.id}')" title="Hapus">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        ${items.length > 0 ? `<ul class="update-items">${itemsHTML}</ul>` : ''}
                    </div>`;
                timeline.appendChild(el);
            });

            container.replaceChildren(timeline);
        }

        // ── MODAL ─────────────────────────────────────────────────────
        function openUpdatesModal() {
            document.getElementById('updatesModal').classList.remove('hidden');
            if (typeof lockScroll === 'function') lockScroll();
            // Selalu mulai dengan 1 baris kosong
            document.getElementById('um_itemsWrap').innerHTML = '';
            addItemRow();
            document.getElementById('um_title').focus();
        }

        function closeUpdatesModal() {
            document.getElementById('updatesModal').classList.add('hidden');
            if (typeof unlockScroll === 'function') unlockScroll();
            document.getElementById('um_title').value = '';
            document.getElementById('um_version').value = '';
            document.getElementById('um_itemsWrap').innerHTML = '';
        }

        function addItemRow(type = 'new', text = '') {
            const wrap = document.getElementById('um_itemsWrap');
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <select>
                    <option value="new"  ${type === 'new' ? 'selected' : ''}>✨ NEW</option>
                    <option value="fix"  ${type === 'fix' ? 'selected' : ''}>🐛 FIX</option>
                    <option value="improve" ${type === 'improve' ? 'selected' : ''}>⚡ IMPROVE</option>
                    <option value="remove" ${type === 'remove' ? 'selected' : ''}>🗑️ REMOVE</option>
                </select>
                <input type="text" class="glass-input" placeholder="Deskripsi perubahan..." value="${text}" spellcheck="false" style="margin:0;">
                <button class="remove-item-btn" onclick="this.parentElement.remove()">
                    <i class="fa-solid fa-xmark"></i>
                </button>`;
            wrap.appendChild(row);
            row.querySelector('input').focus();
        }

        // ── SAVE ──────────────────────────────────────────────────────
        async function saveUpdate() {
            const title = document.getElementById('um_title').value.trim();
            if (!title) { if (typeof showPopup === 'function') showPopup('Judul wajib diisi!', 'error'); return; }

            const rows = document.querySelectorAll('#um_itemsWrap .item-row');
            const items = [];
            rows.forEach(row => {
                const type = row.querySelector('select').value;
                const text = row.querySelector('input').value.trim();
                if (text) items.push({ type, text });
            });

            const btn = document.getElementById('um_btnSave');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + t('loading');

            try {
                const { error } = await supabase.from('app_updates').insert({
                    title,
                    version: document.getElementById('um_version').value.trim() || null,
                    items
                });

                if (error) throw error;

                closeUpdatesModal();
                await loadUpdates();
                if (typeof showToast === 'function') showToast(t('update_posted'), 'success');
            } catch (err) {
                console.error(err);
                if (typeof showPopup === 'function') showPopup(t('failed_generic') + ': ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ' + t('save');
            }
        }

        // ── DELETE ────────────────────────────────────────────────────
        async function deleteUpdate(e, id) {
            e.stopPropagation();
            const yakin = await showPopup(t('confirm_delete_update'), 'confirm');
            if (!yakin) return;

            try {
                const { error } = await supabase.from('app_updates').delete().eq('id', id);
                if (error) throw error;

                document.querySelector(`.update-entry[data-id="${id}"]`)?.remove();
                if (typeof showToast === 'function') showToast(t('update_deleted'), 'success');

                // Kalau timeline kosong, tampilkan empty state
                const timeline = document.querySelector('.updates-timeline');
                if (timeline && timeline.children.length === 0) {
                    document.getElementById('updatesContainer').innerHTML = `
                        <div class="updates-empty">
                            <i class="fa-solid fa-rocket"></i>
                            <p>${t('no_update_recorded')}</p>
                        </div>`;
                }
            } catch (err) {
                if (typeof showPopup === 'function') showPopup(t('failed_generic') + ' hapus: ' + err.message, 'error');
            }
        }

        // Tutup modal klik luar
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('updatesModal').addEventListener('click', function (e) {
                if (e.target === this) closeUpdatesModal();
            });
        });

        // Keyboard shortcut
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && !document.getElementById('updatesModal').classList.contains('hidden')) {
                closeUpdatesModal();
            }
            if (e.ctrlKey && e.key === 'Enter' && !document.getElementById('updatesModal').classList.contains('hidden')) {
                e.preventDefault();
                saveUpdate();
            }
        });

        // ── STATS ─────────────────────────────────────────────────────
        let _cachedData = [];

        function renderStats(data) {
            if (!data || data.length === 0) return;
            _cachedData = data;

            document.getElementById('updatesStatsCard').style.display = 'block';
            document.getElementById('filterWrap').style.display = 'block';

            // Total
            document.getElementById('statTotal').textContent = data.length;

            // Latest version
            const withVersion = data.filter(d => d.version);
            document.getElementById('statVersion').textContent =
                withVersion.length ? withVersion[0].version : '—';

            // Last updated date
            const lastDate = new Date(data[0].created_at).toLocaleDateString('id-ID', {
                day: 'numeric', month: 'long', year: 'numeric'
            });
            document.getElementById('statLastDate').textContent =
                `Terakhir diupdate ${lastDate}`;

            // Type breakdown
            const counts = { new: 0, fix: 0, improve: 0, remove: 0 };
            data.forEach(entry => {
                (entry.items || []).forEach(it => {
                    if (counts[it.type] !== undefined) counts[it.type]++;
                });
            });

            const chips = [
                { key: 'new', label: 'NEW', color: '#2ed573', bg: 'rgba(46,213,115,0.1)', border: 'rgba(46,213,115,0.25)' },
                { key: 'fix', label: 'FIX', color: '#ff6b7a', bg: 'rgba(255,71,87,0.1)', border: 'rgba(255,71,87,0.25)' },
                { key: 'improve', label: 'IMPROVE', color: '#ff9f43', bg: 'rgba(255,159,67,0.1)', border: 'rgba(255,159,67,0.25)' },
                { key: 'remove', label: 'REMOVE', color: 'rgba(255,255,255,0.4)', bg: 'rgba(255,255,255,0.05)', border: 'rgba(255,255,255,0.1)' },
            ].filter(c => counts[c.key] > 0);

            const breakdown = document.getElementById('statBreakdown');
            breakdown.innerHTML = chips.map(c => `
                <div class="stat-chip" style="
                    background: ${c.bg};
                    border: 1px solid ${c.border};
                    color: ${c.color};
                ">
                    <span>${counts[c.key]}</span>
                    <span>${c.label}</span>
                </div>`).join('');
        }

        // ── FILTER ────────────────────────────────────────────────────
        function applyFilter(type, btn) {
            // Update active pill
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');

            // Show/hide entries
            document.querySelectorAll('.update-entry').forEach(entry => {
                if (type === 'all') {
                    entry.classList.remove('filtered-out');
                    return;
                }
                const items = _cachedData.find(d => String(d.id) === String(entry.dataset.id))?.items || [];
                const hasType = items.some(it => it.type === type);
                entry.classList.toggle('filtered-out', !hasType);
            });

            // Empty state kalau semua ke-filter
            const timeline = document.querySelector('.updates-timeline');
            if (!timeline) return;
            const visible = timeline.querySelectorAll('.update-entry:not(.filtered-out)');
            let emptyMsg = timeline.querySelector('.filter-empty-msg');
            if (visible.length === 0) {
                if (!emptyMsg) {
                    emptyMsg = document.createElement('div');
                    emptyMsg.className = 'filter-empty-msg updates-empty';
                    emptyMsg.innerHTML = '<i class="fa-solid fa-filter"></i><p>Tidak ada update dengan tipe ini.</p>';
                    timeline.appendChild(emptyMsg);
                }
            } else {
                emptyMsg?.remove();
            }
        }

        // Hook ke renderUpdates — inject renderStats setelah data dimuat
        const _origRenderUpdates = renderUpdates;
        window.renderUpdates = function (data) {
            _origRenderUpdates(data);
            renderStats(data);
        };
    </script>
</body>

</html>
